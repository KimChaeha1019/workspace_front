<!DOCTYPE html>

<html lang="ko">

    <head>
        <meta charset="UTF-8">
        <title>MySite</title>

        <link rel="stylesheet" href="../../assets/css/reset.css">
        <link rel="stylesheet" href="../../assets/css/mysite.css">
        <link rel="stylesheet" href="../../assets/css/login.css">
    </head>

    <body>

        <div id="wrap">

            <!--header-->
            <div id="header" class="clearfix">
                <h1>MySite</h1>

                <ul class="clearfix">
                    <li>
                        <a href="">로그인</a>
                    </li>

                    <li>
                        <a href="">회원가입</a>
                    </li>
                </ul>
            </div>

            <!--nav-->
            <div id="nav">
                <ul class="clearfix">
                    <li>
                        <a href="">입사지원서</a>
                    </li>

                    <li>
                        <a href="">게시판</a>
                    </li>
                    
                    <li>
                        <a href="">갤러리</a>
                    </li>

                    <li>
                        <a href="">방명록</a>
                    </li>
                </ul>
            </div>

            <!--content-->
            <div id="content2" class="clearfix">

                <!--왼쪽-->
                <div id="aside">
                    <h2>회원</h2>

                    <ul>
                        <li>회원정보</li>
                        <li>로그인</li>
                        <li>회원가입</li>
                    </ul>
                </div>

                <!--오른쪽-->
                <div id="main">

                    <div id="main-head" class="clearfix">
                        <h3>회원가입</h3>

                        <ol class="clearfix">
                            <li>홈</li>
                            <li>회원</li>
                            <li>회원가입</li> <!--오른쪽이 뜨는 이유는 lastchild 이후에 패딩이 들어가서. 이것도 고쳐야 함. -->
                        </ol>
                    </div>

                    <div id="signin-form">

                        <div class="signin-txt">

                            <div id="signin-id">
                                <label for="id">아이디</label>
                                <input id="id" type="text" placeholder="아이디를 입력하세요">
                                <button type="submit" name="" value="">중복체크</button>
                            </div>

                            <div id="signin-pw">
                                <label for="pw">비밀번호</label>
                                <input id="pw" type="password" placeholder="비밀번호를 입력하세요">
                            </div>

                            <div id="signin-name">
                               <label for="name">이름</label>
                               <input id="name" type="text" placeholder="이름을 입력하세요">
                            </div>

                            <div>
                                <span id="signin-sex">성별</span>

                                <span class="rdo-label">
                                    <label for="rdo-male">남</label>
                                    <input id="rdo-male" type="radio" name="range" value="">

                                    <label for="rdo-female">여</label>
                                    <input id="rdo-female" type="radio" name="range" value="">
                                </span>
                            </div>

                            <div class="agree">
                                <label for="chk-agree">약관동의</label>
                                <input id="chk-agree" type="checkbox">서비스 약관에 동의합니다.
                            </div>

                        </div>    

                        <div class="signin-btn">
                            <a href="">회원가입</a>
                        </div>
                    
                    </div>

                </div>

            </div>

            <!--footer-->
            <div id="footer">
                <p>Copyright ⓒ 2025 김채하. All right reserved</p>
            </div>

        </div>

    </body>

</html>
